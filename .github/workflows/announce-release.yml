name: Announce Release on Mastodon

on:
  push:
    branches:
      - main
    paths:
      - 'CHANGELOG.md'

permissions:
  pull-requests: read

jobs:
  post_to_mastodon:
    if: "${{ contains(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    steps:
      - name: Post to Mastodon
        uses: snakemake/mastodon-release-post-action@main # == latest
        with:
          access-token: ${{ secrets.MASTODONBOT }}
          pr-title: ${{ github.event.head_commit.message }}
          image: "logo_dark.png"
          image-description: "Snakemake logo"
          repotitle: "Teaching Material for Software Provenance using the Snakemake Nanopub plugin"
          message: |
            Beep - I am your friendly #Snakemake release announcement bot.
            
            There is a new release of the Teaching Material for Snakemake for Software Provenance using the Snakemake #Nanopub plugin. Its version now is {{ version }}!
            
            If you want to discuss the release, you will find the maintainers here on Mastodon!
            @rupdecat 
            
            If you discover any issues, please report them on {{ issue_url }}.

            See {{ changelog }} for details. Here is the header of the changelog:
            
            ${{ steps.extract-release-notes.outputs.release_notes }}
            
